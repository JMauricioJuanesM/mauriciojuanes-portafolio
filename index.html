<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mauricio Juanes — Desarrollador Full-Stack & UI/UX</title>
    <meta name="description" content="Portafolio profesional de José Mauricio Juanes Martínez. Desarrollador Full-Stack, Frontend UI/UX, fundador de MasFast y colaborador en INFOTEC.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Estilos Desacoplados -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Botones Flotantes de Tema e Idioma -->
    <div class="ui-buttons">
        <button id="lang-toggle" class="ui-button" title="Change Language" aria-label="Cambiar idioma">EN</button>
        <button id="theme-toggle" class="ui-button" title="Cambiar tema" aria-label="Alternar tema claro u oscuro">
            <i class="fas fa-moon"></i>
            <i class="fas fa-sun"></i>
        </button>
    </div>
    
    <!-- Barra de Navegación -->
    <header>
        <nav class="navbar" aria-label="Navegación principal">
            <div class="nav-container">
                <a href="#" class="nav-logo">Mauricio Juanes</a>
                <div class="nav-links">
                    <a href="#experience" id="nav-experience">Experiencia</a>
                    <a href="#projects" id="nav-projects">Proyectos</a>
                    <a href="#awards" id="nav-awards">Reconocimientos</a>
                    <a href="#education" id="nav-education">Educación</a>
                    <a href="#skills" id="nav-skills">Habilidades</a>
                    <a href="#contact" id="nav-contact">Contacto</a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <!-- Sección Hero -->
        <section class="hero" id="hero">
            <div class="container">
                <img src="qr-qa.png" alt="Foto de Mauricio Juanes" class="profile-photo reveal" onerror="this.src='https://placehold.co/180x180/0f172a/0ea5e9?text=MJ'">
                <h1 id="hero-title" class="reveal">Mauricio Juanes</h1>
                <p class="subtitle reveal">
                    <span id="typed"></span><span class="typed-cursor">|</span>
                </p>
                <p id="hero-bio" class="bio reveal"></p>
                <div class="social-links reveal">
                    <a href="https://github.com/JMauricioJuanesM" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub"><i class="fab fa-github"></i></a>
                    <a href="https://gitlab.com/JMauricioJuanesM" target="_blank" rel="noopener noreferrer" title="GitLab" aria-label="GitLab"><i class="fab fa-gitlab"></i></a>
                    <a href="https://linkedin.com/in/mauriciojuanes" target="_blank" rel="noopener noreferrer" title="LinkedIn" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                    <a href="mailto:mauriciojuanes22@gmail.com" title="Correo" aria-label="Correo"><i class="fas fa-envelope"></i></a>
                </div>
                <div class="main-cta reveal">
                    <a href="#contact" id="hero-cta" class="button">Hablemos</a>
                </div>
            </div>
        </section>

        <!-- Sección Experiencia -->
        <section id="experience">
            <div class="container">
                <h2 class="section-title reveal">
                    <i class="fas fa-briefcase"></i><span id="experience-section-title">Experiencia Profesional</span>
                </h2>
                <div id="experience-list">
                    <!-- Contenido renderizado modularmente desde js/data.js -->
                </div>
            </div>
        </section>

        <!-- Sección Proyectos -->
        <section id="projects">
            <div class="container">
                <h2 class="section-title reveal">
                    <i class="fas fa-code-branch"></i><span id="projects-section-title">Proyectos Destacados</span>
                </h2>
                <div id="projects-list">
                    <!-- Contenido renderizado modularmente desde js/data.js -->
                </div>
            </div>
        </section>

        <!-- Sección Reconocimientos & Aceleración -->
        <section id="awards">
            <div class="container">
                <h2 class="section-title reveal">
                    <i class="fas fa-award"></i><span id="awards-section-title">Reconocimientos & Aceleración</span>
                </h2>
                <div class="skills-grid" id="awards-list">
                    <!-- Contenido renderizado modularmente desde js/data.js -->
                </div>
            </div>
        </section>

        <!-- Sección Educación -->
        <section id="education">
            <div class="container">
                <h2 class="section-title reveal">
                    <i class="fas fa-user-graduate"></i><span id="education-section-title">Educación</span>
                </h2>
                <div id="education-list">
                    <!-- Contenido renderizado modularmente desde js/data.js -->
                </div>
            </div>
        </section>

        <!-- Sección Habilidades -->
        <section id="skills">
            <div class="container">
                <h2 class="section-title reveal">
                    <i class="fas fa-cogs"></i><span id="skills-section-title">Stack Tecnológico</span>
                </h2>
                <div class="skills-grid" id="skills-list">
                    <!-- Contenido renderizado modularmente desde js/data.js -->
                </div>
            </div>
        </section>

        <!-- Sección Contacto -->
        <section id="contact">
            <div class="container reveal">
                <h2 class="section-title">
                    <i class="fas fa-paper-plane"></i><span id="contact-section-title">Contacto</span>
                </h2>
                <p id="contact-description"></p>
                <a href="mailto:mauriciojuanes22@gmail.com" id="contact-email-btn" class="button">
                    <i class="fas fa-envelope"></i> Enviar Correo
                </a>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p id="footer-text"></p>
        </div>
    </footer>

    <!-- Scripts Desacoplados y Modulares -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
